<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1118"/><stop offset="1" stop-color="#15242b"/>
    </linearGradient>
    <linearGradient id="browser" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#202936"/><stop offset="1" stop-color="#17202b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>

  <rect width="1280" height="720" rx="14" fill="url(#bg)"/>
  <rect width="1280" height="34" rx="14" fill="#080c11"/>
  <rect y="20" width="1280" height="14" fill="#080c11"/>
  <circle cx="22" cy="17" r="4" fill="#8ce8c3"/>
  <text x="38" y="22" fill="#e9f2f2" font-family="Cantarell, sans-serif" font-size="13" font-weight="600">SnapTess</text>
  <text x="640" y="22" fill="#b9c5c8" font-family="Cantarell, sans-serif" font-size="12" text-anchor="middle">Workspace 1</text>
  <circle cx="1222" cy="17" r="3" fill="#829197"/><circle cx="1236" cy="17" r="3" fill="#829197"/><circle cx="1250" cy="17" r="3" fill="#829197"/>

  <!-- Browser -->
  <g filter="url(#shadow)">
    <rect x="18" y="50" width="616" height="316" rx="12" fill="url(#browser)" stroke="#52636d"/>
    <path d="M18 62a12 12 0 0 1 12-12h592a12 12 0 0 1 12 12v34H18z" fill="#293542"/>
    <circle cx="40" cy="72" r="5" fill="#ff6b6b"/><circle cx="58" cy="72" r="5" fill="#ffd166"/><circle cx="76" cy="72" r="5" fill="#78e6bd"/>
    <rect x="110" y="60" width="370" height="24" rx="12" fill="#111923"/>
    <circle cx="126" cy="72" r="4" fill="#8ce8c3"/><rect x="138" y="68" width="120" height="7" rx="3" fill="#70818c"/>
    <rect x="42" y="122" width="220" height="15" rx="5" fill="#edf6f5"/><rect x="42" y="148" width="310" height="8" rx="4" fill="#677984"/>
    <rect x="42" y="170" width="270" height="8" rx="4" fill="#52636d"/>
    <rect x="42" y="215" width="266" height="112" rx="9" fill="#263743"/>
    <rect x="326" y="215" width="266" height="112" rx="9" fill="#1d4d48"/>
    <circle cx="459" cy="258" r="20" fill="#8ce8c3"/><rect x="365" y="294" width="188" height="8" rx="4" fill="#64bfa5"/>
  </g>

  <!-- Editor -->
  <g filter="url(#shadow)">
    <rect x="646" y="50" width="616" height="316" rx="12" fill="#111820" stroke="#52636d"/>
    <path d="M646 62a12 12 0 0 1 12-12h592a12 12 0 0 1 12 12v34H646z" fill="#242e38"/>
    <circle cx="668" cy="72" r="5" fill="#ff6b6b"/><circle cx="686" cy="72" r="5" fill="#ffd166"/><circle cx="704" cy="72" r="5" fill="#78e6bd"/>
    <rect x="646" y="96" width="124" height="270" fill="#18222c"/>
    <rect x="666" y="120" width="62" height="8" rx="4" fill="#8ce8c3"/><rect x="676" y="145" width="72" height="7" rx="3" fill="#60727c"/>
    <rect x="676" y="166" width="58" height="7" rx="3" fill="#60727c"/><rect x="676" y="187" width="68" height="7" rx="3" fill="#60727c"/>
    <g font-family="monospace" font-size="13">
      <text x="800" y="132" fill="#8ce8c3">const</text><text x="848" y="132" fill="#e8eff0"> layout = snap(windows);</text>
      <text x="800" y="160" fill="#9bbcff">layout</text><text x="848" y="160" fill="#e8eff0">.arrange({</text>
      <text x="824" y="188" fill="#d6a7ff">gap</text><text x="858" y="188" fill="#e8eff0">: 12,</text>
      <text x="824" y="216" fill="#d6a7ff">preset</text><text x="879" y="216" fill="#ffd166">: 'auto'</text>
      <text x="800" y="244" fill="#e8eff0">});</text>
    </g>
  </g>

  <!-- Notes -->
  <g filter="url(#shadow)">
    <rect x="18" y="378" width="616" height="324" rx="12" fill="#f3efe5" stroke="#52636d"/>
    <path d="M18 390a12 12 0 0 1 12-12h592a12 12 0 0 1 12 12v34H18z" fill="#343a40"/>
    <circle cx="40" cy="400" r="5" fill="#ff6b6b"/><circle cx="58" cy="400" r="5" fill="#ffd166"/><circle cx="76" cy="400" r="5" fill="#78e6bd"/>
    <text x="326" y="405" fill="#e8eff0" font-family="Cantarell, sans-serif" font-size="13" text-anchor="middle">Notes</text>
    <rect x="48" y="458" width="250" height="18" rx="5" fill="#24323a"/>
    <rect x="48" y="492" width="520" height="8" rx="4" fill="#abb1ae"/><rect x="48" y="514" width="470" height="8" rx="4" fill="#bec2bd"/>
    <rect x="48" y="536" width="500" height="8" rx="4" fill="#bec2bd"/>
    <circle cx="57" cy="580" r="8" fill="#8ce8c3"/><path d="m53 580 3 3 6-7" fill="none" stroke="#17352f" stroke-width="2"/>
    <rect x="78" y="576" width="210" height="8" rx="4" fill="#8b948f"/>
    <circle cx="57" cy="612" r="8" fill="none" stroke="#8b948f" stroke-width="2"/><rect x="78" y="608" width="270" height="8" rx="4" fill="#8b948f"/>
  </g>

  <!-- Terminal -->
  <g filter="url(#shadow)">
    <rect x="646" y="378" width="616" height="324" rx="12" fill="#0c1218" stroke="#52636d"/>
    <path d="M646 390a12 12 0 0 1 12-12h592a12 12 0 0 1 12 12v34H646z" fill="#242e38"/>
    <circle cx="668" cy="400" r="5" fill="#ff6b6b"/><circle cx="686" cy="400" r="5" fill="#ffd166"/><circle cx="704" cy="400" r="5" fill="#78e6bd"/>
    <text x="954" y="405" fill="#e8eff0" font-family="Cantarell, sans-serif" font-size="13" text-anchor="middle">SnapTess</text>
    <g font-family="monospace" font-size="14">
      <text x="676" y="462" fill="#8ce8c3">●</text><text x="696" y="462" fill="#dbe5e6"> Arrangement active</text>
      <text x="676" y="494" fill="#829197">layout</text><text x="760" y="494" fill="#e8eff0">Auto · 2 × 2</text>
      <text x="676" y="524" fill="#829197">windows</text><text x="760" y="524" fill="#e8eff0">4 arranged</text>
      <text x="676" y="554" fill="#829197">spacing</text><text x="760" y="554" fill="#e8eff0">12 px</text>
      <text x="676" y="596" fill="#8ce8c3">✓ Every window has its place</text>
    </g>
  </g>

  <rect x="8" y="40" width="1264" height="672" rx="18" fill="none" stroke="#8ce8c3" stroke-opacity=".18"/>
</svg>
