name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-26.04
    env:
      GTK_A11Y: none
      SNAPTESS_TEST_PROGRESS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: |
          node --check extension.js
          node --check runtime.js
          node --check prefs.js
          node --check lib/studio.js
      - name: Install GNOME Shell 50 test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-bin gnome-shell gir1.2-adw-1 dbus-daemon
          gnome-shell --version | grep -E '^GNOME Shell 50\.'
      - name: Focus borders during rapid navigation, including the first pass
        run: ./scripts/test-shell.sh tests/focus-border-shell.js
      - name: GNOME Shell 50 and GTK preferences integration tests
        run: ./scripts/test-shell.sh
      - name: Custom layout Studio and native window placement
        run: ./scripts/test-shell.sh tests/custom-layout-shell.js
      - name: Studio Escape after navigation and search
        run: ./scripts/test-shell.sh tests/studio-escape-shell.js
      - name: Readable Studio, Change layout and panel menu in light and dark styles
        run: ./scripts/test-shell.sh tests/light-theme-shell.js
      - name: Large Text grows SnapTess text and Studio still fits the screen
        run: ./scripts/test-shell.sh tests/large-text-shell.js
      - name: Swap arrows and panel icon follow the Shell accent color
        run: ./scripts/test-shell.sh tests/accent-color-shell.js
      - name: Recording a shortcut in Preferences suspends SnapTess shortcuts
        run: ./scripts/test-shell.sh tests/shortcut-recorder-shell.js
      - name: Pinned tile cards stay readable on a light wallpaper
        run: ./scripts/test-shell.sh tests/pin-card-contrast-shell.js
      - name: Keyboard focus shows on the active or selected element
        run: ./scripts/test-shell.sh tests/focus-ring-shell.js
      - name: Change layout list shows its whole content without scrolling
        run: ./scripts/test-shell.sh tests/layout-switcher-shell.js
      - name: Live window catalog, independent drafts and saved-layout search
        run: ./scripts/test-shell.sh tests/studio-library-shell.js
      - name: Global Undo and Redo shortcuts and menu
        run: ./scripts/test-shell.sh tests/global-redo-shell.js
      - name: Pending launches and shared indicators after reload
        run: ./scripts/test-shell.sh tests/pending-launch-reload-shell.js
      - name: Loader reloads the runtime in place, without disabling extensions
        run: ./scripts/test-shell.sh tests/loader-reload-shell.js
      - name: Locking the screen keeps tiling and Spaces
        run: ./scripts/test-shell.sh tests/session-lock-shell.js
      - name: Close gaps setting and windows sent to another workspace
        run: ./scripts/test-shell.sh tests/close-gaps-shell.js
      - name: Shared windows across Spaces and displays
        run: SNAPTESS_TWO_MONITORS=1 ./scripts/test-shell.sh tests/shared-spaces-shell.js
      - name: Space shortcuts keep the display they empty
        run: SNAPTESS_TWO_MONITORS=1 ./scripts/test-shell.sh tests/space-shortcuts-shell.js
      - name: Linked resizing with native windows and delayed clients
        run: ./scripts/test-shell.sh tests/linked-resize-shell.js
      - name: GNOME Shell 50 two-monitor integration test
        run: SNAPTESS_TWO_MONITORS=1 ./scripts/test-shell.sh
      - uses: actions/upload-artifact@v4
        with:
          name: snaptess-extension
          path: dist/*.zip
