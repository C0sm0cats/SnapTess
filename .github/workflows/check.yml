name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: |
          node --check extension.js
          node --check runtime.js
          node --check prefs.js
          node --check lib/studio.js
      - name: Install GNOME Shell 50 test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-bin gnome-shell gir1.2-adw-1 dbus-daemon
          gnome-shell --version | grep -E '^GNOME Shell 50\.'
      - name: GNOME Shell 50 and GTK preferences integration tests
        run: ./scripts/test-shell.sh
      - name: GNOME Shell 50 two-monitor integration test
        run: SNAPTESS_TWO_MONITORS=1 ./scripts/test-shell.sh
      - uses: actions/upload-artifact@v4
        with:
          name: snaptess-extension
          path: dist/*.zip
